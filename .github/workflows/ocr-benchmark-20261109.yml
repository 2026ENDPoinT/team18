name: Isolated OCR benchmark
on:
  push:
    branches: [codex/ocr-benchmark-20261109]
    paths:
      - '.github/workflows/ocr-benchmark-20261109.yml'
      - 'scripts/ocr_benchmark_20261109.py'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU OCR dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ai/requirements-ocr.txt
      - name: Compare both recognizers on the same samples
        run: python scripts/ocr_benchmark_20261109.py
      - name: Preserve report and raw predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-benchmark-20261109
          path: |
            ocr-benchmark-results/report.json
            ocr-benchmark-results/NanumGothic-Regular.ttf
          if-no-files-found: warn
          retention-days: 7
